[package]
name = "twoyi"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# This must contain at least cdylib for Android libraries to be generated.
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.180"
once_cell = "1.21.3"

# for log
log = "0.4.29"
android_logger = "0.15.1"

ndk = "0.9.0"
ndk-sys = "0.6.0"
jni = { version = "0.21.1", default-features = false }

# for input system
uinput-sys = "0.1.7"
unix_socket = "0.5.0"

parking_lot = "0.12.5"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "net", "sync", "io-util"] }
anyhow = "1.0.100"

[patch.crates-io]
uinput-sys = { git = 'https://github.com/tiann/rust-uinput-sys' }